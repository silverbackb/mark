name: CI

# Garde-fou minimal avant la production. Railway ne construit qu'APRES le push : sans ce
# workflow, un lockfile desynchronise ou une erreur de type n'est vue qu'au deploiement.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci echoue si package-lock.json diverge de package.json.
      # C'est exactement ce qui a casse un deploiement le 2026-07-25.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run --if-present typecheck

      - name: Build
        run: npm run --if-present build

      - name: Test
        run: npm run --if-present test
